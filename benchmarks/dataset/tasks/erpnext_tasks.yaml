- id: Q21
  group: E
  group_title: Concurrency & database semantics
  origin_note: 'PR-derived (source_pr #56905 — postgres advisory locking for stock reposting/batch valuation)'
  question: 'When ERPNext runs on PostgreSQL, how does the stock reposting/valuation subsystem prevent
    concurrent background jobs from deadlocking or double-computing the average rate for the same item-warehouse
    batch valuation?

    '
  key_facts:
  - 'repost_gate(item_code, warehouse) in erpnext/stock/stock_ledger.py returns a session-level Postgres
    advisory lock via frappe.db.advisory_lock(("stock_repost", item_code, warehouse), ...) when running
    on Postgres, or a no-op context manager otherwise (so MariaDB keeps relying on plain deadlock-retry).

    '
  - 'repost_gate is used as a context manager wrapping update_entries_after(...) inside repost_future_sle''s
    loop, so row-level locks happen only after the advisory lock is acquired, avoiding lock-order deadlocks
    between concurrent reposts of the same item/warehouse.

    '
  - 'The synchronous repost_current_voucher submit path is NOT wrapped by repost_gate, to avoid blocking
    a document submit behind a background repost.

    '
  - 'BatchNoValuation.calculate_avg_rate in erpnext/stock/serial_batch_bundle.py takes a transaction-scoped
    advisory lock via frappe.db.transaction_advisory_lock keyed on ("batch-valuation", item_code, warehouse),
    only for outward transactions and only on Postgres.

    '
  - 'The rationale documented in code is that MariaDB serializes via grouped FOR UPDATE + gap locks on
    historical ledger reads, but Postgres has no gap locks, so a transaction-scoped advisory lock (auto-released
    at commit/rollback) serializes without either downside.

    '
  - 'Test coverage in test_serial_and_batch_bundle.py is skipped unless the db_type is postgres, and asserts
    pg_locks with locktype = ''advisory'' grows after creating a Delivery Note against a batched item.

    '
  anchor_files:
  - erpnext/stock/stock_ledger.py
  - erpnext/stock/serial_batch_bundle.py

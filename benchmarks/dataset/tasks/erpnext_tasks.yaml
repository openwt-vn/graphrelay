    name DESC so the latest asset location/custodian is uniquely selected.

    '
  - 'get_open_payment_requests_for_references in erpnext/accounts/doctype/payment_entry/payment_entry.py
    orders by creation ASC then name ASC so Payment Requests sharing a transaction date allocate in identical

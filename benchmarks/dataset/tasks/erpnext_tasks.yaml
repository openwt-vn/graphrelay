tasks:
- id: Q01
  group: A
  group_title: End-to-end / cross-module synthesis
  origin_note: large architecture (Sales Order to GL Entry full cycle, stock-delivered-but-not-billed)
  question: 'Trace the full lifecycle of a stock item from Sales Order through to final accounting: Sales
    Order, Delivery Note, and Sales Invoice. Given that a Delivery Note can be submitted well before the
    corresponding Sales Invoice, how does ERPNext ensure the cost of goods sold is booked exactly once
    rather than twice? Name the relevant functions, classes and files across all three doctypes.

    '
  key_facts:
  - 'Sales Order itself posts no GL entries — it is not an accounting document; SalesOrder.on_submit()
    (sales_order.py) only handles credit limit, reserved qty, and approving-authority checks.

    '
  - 'DeliveryNote.on_submit() (erpnext/stock/doctype/delivery_note/delivery_note.py) calls update_stock_ledger()
    (creating Stock Ledger Entries that reduce warehouse qty) and then make_gl_entries(), inherited from
    controllers/stock_controller.py, which books inventory (credit) against a provisional expense/COGS
    account for the delivered items.

    '
  - 'SalesInvoice.on_submit() (erpnext/accounts/doctype/sales_invoice/sales_invoice.py) calls update_billing_status_in_dn()
    and then make_gl_entries(), which goes through erpnext/accounts/doctype/sales_invoice/services/gl_composer.py
    (SalesInvoiceGLComposer).

    '
  - 'The reconciliation step that prevents double-booking COGS is the composer''s stock-delivered-but-not-billed
    handling: for each invoice line referencing a delivery_note/dn_detail, it looks up the DN''s Stock
    Ledger Entry value and the DN item''s expense_account, and if that account is the provisional/SDBNB
    account, it reverses the provisional DN-side booking and re-books it as real COGS tied to the invoice.

    '
  - 'This means COGS is recognized exactly once even though the Delivery Note and Sales Invoice can be
    submitted at very different times — the invoice-side logic actively reverses what the delivery-note-side
    logic already posted, rather than both sides posting independently.

    '
  - 'If update_stock is set on the Sales Invoice itself (bypassing a separate Delivery Note), the invoice
    does its own update_stock_ledger() and stock-movement GL entries directly instead of going through
    the DN-reversal path.

    '
  anchor_files:
  - erpnext/selling/doctype/sales_order/sales_order.py
  - erpnext/stock/doctype/delivery_note/delivery_note.py
  - erpnext/controllers/stock_controller.py
  - erpnext/accounts/doctype/sales_invoice/sales_invoice.py
  - erpnext/accounts/doctype/sales_invoice/services/gl_composer.py
- id: Q02
  group: A
  group_title: End-to-end / cross-module synthesis
  origin_note: 'large architecture (subcontracting flow: raw material transfer through job work to receipt)'
  question: 'Trace how raw materials move from a company''s own warehouse to a supplier for subcontracted
    job work, get tracked against a Subcontracting Order, and are reconciled with cost roll-up when the
    finished goods are received via Subcontracting Receipt. Name the relevant functions, classes and files
    across the whole flow.

    '
  key_facts:
  - 'Subcontracting Order (erpnext/subcontracting/doctype/subcontracting_order/subcontracting_order.py)
    is created from a Purchase Order, with raw-material-supplied items populated via populate_items_table();
    reserve_raw_materials() optionally creates Stock Reservation Entries for the materials to be supplied.

    '
  - 'A Stock Entry with purpose "Send to Subcontractor" transfers raw materials from the company warehouse
    to the supplier''s notional warehouse, linked back to the Subcontracting Order via the entry''s subcontracting_order
    field, updating the order''s status on submit.

    '
  - 'Subcontracting Receipt (erpnext/subcontracting/doctype/subcontracting_receipt/subcontracting_receipt.py)
    is created against the Subcontracting Order once the supplier returns finished goods; its validate()
    calls set_available_qty_for_consumption(), calculate_items_qty_and_amount(), and validate_bom_required_qty().

    '
  - 'The reconciliation of how much of each supplied raw material was actually consumed (vs. still with
    the supplier) lives in the shared erpnext/controllers/subcontracting_controller.py, via __get_transferred_items(),
    __get_consumed_items(), and __update_consumed_materials().

    '
  - 'set_rate_for_supplied_items() in the same controller computes the raw-material cost to roll into
    the finished good''s incoming valuation rate, based on the BOM (set_items_bom()).

    '
  - 'On submit, GL entries for the Subcontracting Receipt book raw materials consumption, service/labor
    charges, and the received finished-goods stock value (= consumed RM value + service cost), via a dedicated
    gl_composer in the subcontracting_receipt services module.

    '
  - 'Cancelling the Subcontracting Receipt reverses the flow via reset_raw_materials() and reset_supplied_items(),
    restoring the Subcontracting Order''s supplied/consumed quantities.

    '
  anchor_files:
  - erpnext/subcontracting/doctype/subcontracting_order/subcontracting_order.py
  - erpnext/stock/doctype/stock_entry/stock_entry.py
  - erpnext/subcontracting/doctype/subcontracting_receipt/subcontracting_receipt.py
  - erpnext/controllers/subcontracting_controller.py
- id: Q03
  group: A
  group_title: End-to-end / cross-module synthesis
  origin_note: large architecture (Landed Cost Voucher allocation and retroactive repost)
  question: 'How does a Landed Cost Voucher redistribute freight/customs charges across multiple Purchase
    Receipt line items, and how does it retroactively update the valuation rate and GL postings of Purchase
    Receipts that were already submitted before the Landed Cost Voucher existed? Name the relevant functions
    and files.

    '
  key_facts:
  - 'Landed Cost Voucher (erpnext/stock/doctype/landed_cost_voucher/landed_cost_voucher.py) is created
    against one or more already-submitted Purchase Receipts/Purchase Invoices/Subcontracting Receipts,
    fetched via get_items_from_purchase_receipts().

    '
  - 'set_applicable_charges_on_item() distributes total_taxes_and_charges proportionally across item rows
    based on a configurable distribute_charges_based_on setting (e.g. Qty, Amount, or Distribute Manually),
    dumping any rounding remainder onto the last item row.

    '
  - 'validate_applicable_charges_for_item() enforces that the sum of per-item applicable_charges reconciles
    exactly to total_taxes_and_charges within a precision-based tolerance, else throws.

    '
  - 'On submit, update_landed_cost() is the retroactive-repost mechanism: for each linked receipt it stamps
    landed_cost_voucher_amount onto the PR items and recomputes the item''s landed valuation rate.

    '
  - 'It then performs what is effectively a simulated cancel-then-resubmit on the linked document — reversing
    the existing stock ledger and GL entries and regenerating them with the new landed cost — without
    actually changing the document''s persisted submitted status, purely to make the Stock Ledger Entries
    and GL Entries reflect the updated valuation.

    '
  - 'validate_asset_qty_and_status() additionally guards that, for fixed-asset items, the correct number
    of Asset records already exist in an appropriate status before landed cost can be allocated onto them.

    '
  - 'Cancelling the Landed Cost Voucher re-runs update_landed_cost(), effectively reverting the linked
    receipts back to their pre-LCV valuation.

    '
  anchor_files:
  - erpnext/stock/doctype/landed_cost_voucher/landed_cost_voucher.py
  - erpnext/controllers/stock_controller.py
- id: Q04
  group: A
  group_title: End-to-end / cross-module synthesis
  origin_note: 'v2 large-arch / PR-derived (source_pr #56858 — POST-only enforcement on state-changing
    whitelisted endpoints)'
  question: 'Many of ERPNext''s whitelisted endpoints modify data (creating, saving or submitting documents).
    How does the codebase restrict such state-changing whitelisted endpoints from being invoked via HTTP
    GET? Explain the mechanism used and name several concrete endpoints (with their files) that carry
    this restriction.

    '
  key_facts:
  - 'The restriction is expressed as an argument to the whitelist decorator itself: @frappe.whitelist(methods=["POST"])
    — not a separate decorator or middleware.

    '
  - 'set_closing_balance_as_per_statement in erpnext/accounts/doctype/bank_account/bank_account.py is
    decorated @frappe.whitelist(methods=["POST"]) and cannot be called via GET.

    '
  - 'make_payment_request in erpnext/accounts/doctype/payment_request/payment_request.py is POST-only.

    '
  - 'make_quality_inspections in erpnext/controllers/stock_controller.py is POST-only.

    '
  - 'set_work_order_ops in erpnext/manufacturing/doctype/work_order/work_order.py is POST-only.

    '
  - 'The restriction specifically targets endpoints whose bodies create or modify documents (get_doc followed
    by insert/save/submit), applied as a sweep across a dozen-plus modules (accounts, assets, buying,
    controllers, crm, integrations, manufacturing, projects, selling, stock and more).

    '
  anchor_files:
  - erpnext/accounts/doctype/bank_account/bank_account.py
  - erpnext/accounts/doctype/payment_request/payment_request.py
  - erpnext/controllers/stock_controller.py
  - erpnext/manufacturing/doctype/work_order/work_order.py
- id: Q05
  group: A
  group_title: End-to-end / cross-module synthesis
  origin_note: 'v2 flow / PR-derived (source_pr #56264/#56206 — partial raw-material pick/transfer from
    work order)'
  question: 'When raw materials for a Work Order are transferred in several partial batches (e.g. via
    pick lists that could only be partially fulfilled), how does ERPNext compute the work order''s "material
    transferred for manufacturing" progress, and what prevents transferring more material than the work
    order requires? Name the relevant functions and files.

    '
  key_facts:
  - 'recompute_material_transferred_for_manufacturing in erpnext/manufacturing/doctype/work_order/services/required_items.py
    recomputes material_transferred_for_manufacturing from actual item-level transferred quantities rather
    than from a stock entry''s fg_completed_qty.

    '
  - 'For the pick-list flow (stock entries with fg_completed_qty == 0) it computes the minimum fraction
    of transferred_qty / required_qty across required items (the bottleneck item), clamps it at 1.0, and
    sets material_transferred_for_manufacturing to that fraction times the work order qty.

    '
  - 'When stock entries carry fg_completed_qty > 0, the older behavior is preserved: progress comes from
    summing fg_completed_qty over submitted "Material Transfer for Manufacture" entries.

    '
  - 'Only required-items rows with include_item_in_manufacturing set and required_qty > 0 participate
    in the fraction computation.

    '
  - 'The upper bound is enforced by _validate_no_excess_transfer in erpnext/stock/doctype/stock_entry/services/material_transfer.py,
    which computes pending = required_qty - transferred_qty per item and throws an "Excess Material Transfer"
    error when a transfer exceeds it.

    '
  - 'That excess-transfer check is skipped for return entries and when Manufacturing Settings'' backflush_raw_materials_based_on
    is "Material Transferred for Manufacture".

    '
  - 'Source rows are matched to required items by item_code with a fallback to original_item (substituted
    components), counting only rows that have a source warehouse.

    '
  anchor_files:
  - erpnext/manufacturing/doctype/work_order/services/required_items.py
  - erpnext/stock/doctype/stock_entry/services/material_transfer.py
- id: Q06
  group: B
  group_title: Caller/callee trace + impact analysis
  origin_note: impact analysis (general ledger posting)
  question: 'Suppose you need to change the signature and the merge behavior of make_gl_entries in erpnext/accounts/general_ledger.py.
    What does this function do today (validations, merging/deduplication, round-off handling), and what
    would be affected by the change — enumerate the main document types and modules that call it.

    '
  key_facts:
  - 'make_gl_entries (erpnext/accounts/general_ledger.py) is the single entry point for posting a GL map:
    it runs process_gl_map and then save_entries; on cancel it delegates to make_reverse_gl_entries.

    '
  - 'merge_similar_entries deduplicates GL rows by a merge key built from account, cost center, party,
    against_voucher and related fields, summing debit/credit of rows with equal keys.

    '
  - 'process_debit_credit_difference enforces that total debit equals total credit within an allowance,
    and books a balancing round-off GL entry via make_round_off_gle using the company round-off account.

    '
  - 'Frozen-period protection: check_freezing_date blocks postings on or before the accounts-frozen date
    unless the user holds the role allowed for frozen entries; validate_against_pcv blocks entries before
    the last Period Closing Voucher.

    '
  - 'Direct invoice/payment callers include Sales Invoice, Purchase Invoice, Payment Entry and Journal
    Entry (each doctype''s make_gl_entries call site).

    '
  - 'Stock-side callers go through erpnext/controllers/stock_controller.py, which covers Delivery Note,
    Purchase Receipt, Stock Entry, Stock Reconciliation and other stock documents.

    '
  - 'Other affected modules include Period Closing Voucher, deferred revenue processing, asset doctypes
    (Asset, Asset Capitalization, Asset Repair), and accounting repost utilities (repost_accounting_ledger
    / repost_gle_for_stock_vouchers).

    '
  - 'Sales Invoice calls make_gl_entries with merge_entries=False, so a change to default merge behavior
    affects Journal/Payment entries differently from Sales Invoice.

    '
  anchor_files:
  - erpnext/accounts/general_ledger.py
  - erpnext/accounts/services/gl_validator.py
  - erpnext/controllers/stock_controller.py
- id: Q07
  group: B
  group_title: Caller/callee trace + impact analysis
  origin_note: 'PR-derived (source_pr #56898 — Trends report group-by empty-row guard)'
  question: 'In ERPNext''s shared "Trends" report engine (used by Sales Order Trends, Purchase Order Trends,
    Quotation Trends, Sales/Purchase Invoice Trends, and others), what happens when a "Group By" filter
    is combined with a "Based On" filter and the detail query for one of the distinct group values finds
    no matching data for that particular based-on row — does the report break?

    '
  key_facts:
  - 'The shared logic is get_data(filters, conditions) in erpnext/controllers/trends.py, imported by all
    "Trends" report modules across selling/buying/accounts.

    '
  - 'When group_by is set, the function first gets one row per based-on key, then for each runs a second
    query to get distinct values of the group-by column restricted to that based-on key.

    '
  - 'For each distinct group-by value it runs a third detail query filtered by both the group-by value
    and the based-on key.

    '
  - 'The guard is "if not row1: continue" — if that detail query returns zero rows for a particular combination,
    the loop iteration is skipped entirely rather than proceeding.

    '
  - 'Without that guard, subsequent code indexing into the empty row1 list would raise an IndexError and
    crash the whole report.

    '
  - 'After the group-by branch completes, a totals row is appended that sums only Float and Currency-typed
    columns, treating None as 0.

    '
  anchor_files:
  - erpnext/controllers/trends.py
- id: Q08
  group: B
  group_title: Caller/callee trace + impact analysis
  origin_note: 'PR-derived (source_pr #56895 — budget requested/ordered amount computed per row)'
  question: 'When ERPNext checks a Material Request or Purchase Order against a Budget, how does the system
    compute the "requested amount" across multiple matching line items, and why does the placement of
    rate relative to the aggregate Sum() function matter for correctness?

    '
  key_facts:
  - 'get_requested_amount in erpnext/accounts/doctype/budget/budget.py computes amount as Sum((stock_qty
    - ordered_qty) * rate) over Material Request Item, i.e. rate is multiplied per-row inside the Sum
    aggregate, not applied after summing quantities.

    '
  - 'Computing rate inside the aggregate ensures each row''s rate is multiplied by that same row''s outstanding
    quantity before summation, so the requested amount is computed per matching line then totaled, rather
    than summing quantities first and multiplying by an arbitrary single rate afterward.

    '
  - 'The query filters to rows where stock_qty > ordered_qty and applies shared conditions (item code,
    budget_against field, fiscal-year date range), so only outstanding quantities on in-scope rows contribute.

    '
  - 'get_ordered_amount follows the same per-row pattern for Purchase Order Items, using each row''s own
    stored amount/billed_amt values.

    '
  - 'A shared helper builds the common WHERE conditions used by both functions: matching expense_account,
    optionally the budget_against_field, and a date-range filter bounded by the budget''s fiscal year.

    '
  - 'compare_expense_with_budget calls both functions to compute requested_amount and ordered_amount,
    then sums actual_expense + amount against budget_amount to decide whether to throw (Stop) or warn
    (msgprint) per the budget''s configured action.

    '
  anchor_files:
  - erpnext/accounts/doctype/budget/budget.py
- id: Q09
  group: B
  group_title: Caller/callee trace + impact analysis
  origin_note: 'PR-derived (source_pr #56882 — reset_mode_of_payments AttributeError on POS Invoice)'
  question: 'When a cashier reopens a saved draft POS Invoice and its payment methods need to be refreshed
    from the POS Profile, how does reset_mode_of_payments repopulate the payments table, and how does
    the underlying helper avoid breaking when called on a doctype that lacks some Sales-Invoice-only fields?

    '
  key_facts:
  - 'POSInvoice.reset_mode_of_payments is a whitelisted method that, if pos_profile is set, fetches the
    cached POS Profile doc and calls update_multi_mode_option, then resets paid_amount to 0.

    '
  - 'update_multi_mode_option is defined once, shared, and used by both Sales Invoice and POS Invoice.

    '
  - 'Inside it, a line reads doc.get("is_created_using_pos") rather than direct attribute access doc.is_created_using_pos.

    '
  - 'This matters because is_created_using_pos is a field defined on Sales Invoice but NOT on POS Invoice
    — a Frappe Document only auto-generates attributes for its own declared fields, so direct dotted access
    would raise AttributeError on a POS Invoice.

    '
  - 'Using .get() instead safely evaluates to None/falsy on POS Invoice instead of raising, which gates
    a non-blocking toast notification about payment methods being refreshed.

    '
  - 'A dedicated regression test creates a draft POS Invoice, calls reset_mode_of_payments, and asserts
    it does not raise and that the payments table gets repopulated.

    '
  anchor_files:
  - erpnext/accounts/doctype/pos_invoice/pos_invoice.py
  - erpnext/accounts/doctype/sales_invoice/services/pos.py
- id: Q10
  group: B
  group_title: Caller/callee trace + impact analysis
  origin_note: 'v2 impact / PR-derived (source_pr #56315 — item rate calculation rewrite)'
  question: 'How does ERPNext compute a transaction item''s final rate from its price list rate, margin,
    discount and applied pricing rules — and what happens when the user manually overrides the rate? Trace
    the current per-item rate calculation in the shared taxes-and-totals controller, naming the functions
    involved.

    '
  key_facts:
  - 'The per-item rate is computed by calculate_item_rate(item) in erpnext/controllers/taxes_and_totals.py;
    calculate_item_values iterates the document items and calls it before setting net_rate/amount/net_amount.

    '
  - 'calculate_item_rate early-returns when item.price_list_rate is falsy, first clearing margin and discount
    via remove_margin / remove_discount helpers and zeroing rate_with_margin.

    '
  - 'When pricing rules apply (item.pricing_rules set and the document does not ignore pricing rules),
    margin fields are re-derived from the applicable Pricing Rules (via get_applied_pricing_rules) before
    the rate math runs.

    '
  - 'The computed candidate rate is rate_with_margin (from get_rate_with_margin) minus the discount amount
    derived from discount_percentage, rounded to the rate precision.

    '
  - 'Precedence: if pricing rules apply or item.rate is unset, the computed rate wins; if the user-entered
    item.rate differs from the computed rate, the user''s rate is preferred and margin/discount are reset
    to reconcile with it.

    '
  - 'When the preferred user rate exceeds price_list_rate, the gap is stored as an "Amount"-type margin
    and the discount is cleared; when it is below, the gap becomes discount_amount (with discount_percentage
    zeroed) and the margin is cleared.

    '
  - 'get_rate_with_margin returns price_list_rate unchanged when no margin is set and applies a (1 + rate/100)
    multiplier for "Percentage" margins.

    '
  anchor_files:
  - erpnext/controllers/taxes_and_totals.py
- id: Q11
  group: C
  group_title: Semantic gap (no keyword overlap with the code)
  origin_note: 'PR-derived (source_pr #56883 — Dunning outstanding amount currency for foreign-currency
    invoices)'
  question: 'When a Dunning is created from an overdue Sales Invoice, how is the outstanding amount on
    each Overdue Payment row computed, and how does this behave correctly when the invoice is in a foreign
    currency but posts against a receivable account in a different currency?

    '
  key_facts:
  - 'The Dunning''s child table row population happens inside create_dunning in erpnext/accounts/doctype/sales_invoice/mapper.py,
    specifically in a nested postprocess_dunning function.

    '
  - 'When the source invoice has exactly one payment schedule row, the code special-cases the outstanding
    amount: if party_account_currency differs from currency (foreign-currency invoice), the row''s outstanding
    is set from the invoice''s payment_schedule[0].outstanding rather than the invoice''s own outstanding_amount
    field.

    '
  - 'This distinction matters because outstanding_amount on Sales Invoice is denominated in party_account_currency,
    while Payment Schedule''s and Overdue Payment''s outstanding fields are both denominated in the transaction
    currency — so outstanding_amount is not reliably in the invoice''s transaction currency when the two
    currencies differ.

    '
  - 'When party_account_currency equals currency (no mismatch), the code falls back to using the invoice''s
    own outstanding_amount field directly.

    '
  - 'A dedicated regression test creates a USD Sales Invoice against an INR receivable account and asserts
    the invoice''s outstanding_amount is in INR but payment_schedule[0].outstanding and the resulting
    Dunning''s overdue_payments outstanding are both in USD.

    '
  - 'This special-case branch only applies when the invoice has exactly one payment schedule row; for
    invoices with multiple schedule rows, the general mapping (filtering to schedule rows with outstanding
    > 0) is used instead.

    '
  anchor_files:
  - erpnext/accounts/doctype/sales_invoice/mapper.py
  - erpnext/accounts/doctype/dunning/dunning.py
- id: Q12
  group: C
  group_title: Semantic gap (no keyword overlap with the code)
  origin_note: 'PR-derived (source_pr #56870 — permission checks on Item form auxiliary endpoints)'
  question: 'The Item form loads several pieces of auxiliary data (attribute autocomplete, item price
    previews, opening stock creation) via whitelisted server calls. How does each of these guard against
    being called by a user who lacks the appropriate read/write permission?

    '
  key_facts:
  - 'get_item_attribute in erpnext/stock/doctype/item/item.py, used for autocomplete in a child table,
    explicitly checks frappe.has_permission("Item") and throws "No Permission" if false before querying
    Item Attribute Value records.

    '
  - 'get_item_prices checks read permission on the Item Price doctype specifically (not Item), since it
    reads Item Price records rather than the Item itself, throwing "Not permitted" as a PermissionError.

    '
  - 'make_opening_stock_entry checks write permission on Item for the specific item_code before creating
    an opening Stock Entry for that item.

    '
  - 'On the client side, item.js pre-emptively checks whether the user can read Item Price and hides the
    prices section entirely if not, rather than surfacing a server-side PermissionError.

    '
  - 'The server-side permission check in get_item_prices still acts as defense-in-depth against direct/bypassed
    calls to the whitelisted endpoint, independent of the client-side visibility check.

    '
  - 'Other whitelisted helpers in the same file with no data-sensitivity concerns (like UOM conversion
    factor lookup) intentionally omit explicit permission checks since they only expose non-confidential
    metadata.

    '
  anchor_files:
  - erpnext/stock/doctype/item/item.py
- id: Q13
  group: C
  group_title: Semantic gap (no keyword overlap with the code)
  origin_note: v2 semantic gap (stock promised to a customer — reservation)
  question: 'In ERPNext, some stock sitting in a warehouse may already be promised to a specific customer.
    How does the system know that promised goods cannot be used for someone else — where is the promise
    recorded, how is "still available to promise" calculated, and how does it stop an unrelated shipment
    from taking that stock? Name the relevant functions and files.

    '
  key_facts:
  - 'Reservations are recorded as separate Stock Reservation Entry documents (erpnext/stock/doctype/stock_reservation_entry/)
    holding reserved_qty, delivered_qty and available_qty, linked to a voucher (typically a Sales Order).

    '
  - 'get_available_qty_to_reserve computes availability as the stock balance minus outstanding reservations
    — summing (reserved_qty - delivered_qty - transferred_qty - consumed_qty) over submitted Stock Reservation
    Entries.

    '
  - 'The reserved total is mirrored onto the warehouse Bin via update_reserved_stock_in_bin, called on
    submit/cancel of a reservation entry.

    '
  - 'The negative-stock guard in erpnext/stock/stock_ledger.py (validate_negative_stock) subtracts reserved
    stock from the post-transaction quantity, so an unrelated outward movement is blocked even when the
    raw quantity looks sufficient.

    '
  - 'Reservation creation is concurrency-safe: availability is computed under row locks (for_update, with
    Bin locking on Postgres) so two simultaneous reservations cannot both claim the same stock.

    '
  - 'Delivery Notes reconcile against reservations via validate_against_stock_reservation_entries in erpnext/stock/doctype/delivery_note/delivery_note.py,
    linking the shipment back to the promised quantities.

    '
  anchor_files:
  - erpnext/stock/doctype/stock_reservation_entry/stock_reservation_entry.py
  - erpnext/stock/stock_ledger.py
  - erpnext/stock/doctype/delivery_note/delivery_note.py
- id: Q14
  group: C
  group_title: Semantic gap (no keyword overlap with the code)
  origin_note: v2 semantic gap (tax-inclusive prices — working backwards to pre-tax)
  question: 'When item prices in ERPNext already include tax, how does the system work backwards to determine
    the pre-tax amount of each line? Explain where this happens and how it handles multiple inclusive
    taxes, compounding tax rows, per-quantity taxes and deduction-type taxes.

    '
  key_facts:
  - 'The back-calculation is determine_exclusive_rate in erpnext/controllers/taxes_and_totals.py, and
    it is skipped entirely unless at least one tax row has included_in_print_rate set.

    '
  - 'It accumulates a cumulated_tax_fraction across the inclusive tax rows per item and recovers the net
    amount by dividing the gross line amount by (1 + cumulated_tax_fraction).

    '

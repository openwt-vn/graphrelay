- id: Q25
  group: E
  group_title: Concurrency & database semantics
  origin_note: 'v2 concurrency-db / PR-derived (source_pr #56453 — MariaDB/Postgres NULL-ordering parity)'
  question: 'MariaDB and PostgreSQL sort NULL values differently. In queries where that difference would
    change which row ERPNext picks (not just display order), how does the codebase explicitly control
    NULL ordering? Describe the mechanisms used and name concrete query sites.

    '
  key_facts:
  - 'Two mechanisms are used: wrapping the nullable column in a sentinel default (IfNull(col, "") / coalesce(col,
    '''')) inside the ORDER BY, or adding an explicit boolean nulls-position key (col.isnull()) as a leading
    sort term.

    '
  - 'The underlying difference: MariaDB sorts NULL as the lowest value (first under ASC, last under DESC)
    while PostgreSQL defaults to the opposite, so an ORDER BY on a nullable column with a LIMIT-1-style
    pick can return different rows per engine.

    '
  - '_get_pricing_rules in erpnext/accounts/doctype/pricing_rule/utils.py orders by coalesce(priority,
    '''') desc so NULL priorities sort like the lowest value on both engines.

    '
  - 'get_item_price in erpnext/stock/get_item_details.py orders by IfNull(batch_no, "") DESC so the picked
    Item Price row matches across engines when batch_no is NULL.

    '
  - 'The point-of-sale get_items query (erpnext/selling/page/point_of_sale/point_of_sale.py) adds valid_from.isnull()
    as a leading ASC sort key before selecting the price.

    '
  - 'get_serial_nos_based_on_filters in erpnext/stock/doctype/serial_and_batch_bundle/serial_and_batch_bundle.py
    adds an isnull() DESC key when ordering by amc_expiry_date so NULL expiry rows land in the MariaDB
    position.

    '
  anchor_files:

    UPDATE SKIP LOCKED, so concurrent callers each lock and claim a disjoint set of rows instead of blocking
    on or double-processing rows another worker already has locked.

    '
  - 'Each claimed row''s status is immediately set to "Running" and the transaction is committed early,
    before the actual work is dispatched via a background job, so the claim is durable before processing

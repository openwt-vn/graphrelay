    this absence rather than assume a symmetric supplier-side limit exists.

    '
  - 'purchase_order.py contains no credit_limit/check_credit_limit logic at all — the concept simply does
    not apply on the buying side the way it does on the selling side.

    '
  - 'What DOES gate Purchase Order (and other buying documents) submission is an entirely different, opt-in
    mechanism: Authorization Rule / Authorization Control, which enforces per-user/per-role approving-authority
    limits (e.g. a user can only approve POs up to a configured amount) — this is an internal approval-workflow
    control, not a customer/supplier balance-owed check.

    '
  - 'A Supplier Scorecard''s prevent_pos setting can also block new Purchase Orders against a poorly-scoring
    supplier, but this is a performance-based gate, not a monetary spend-limit check — it blocks regardless
    of the PO''s amount.

    '
  - 'This asymmetry exists because credit limit is fundamentally a receivables-risk control (will the
    customer pay us back), which has no natural buying-side equivalent — a company does not extend "credit"
    to its own future self when purchasing from a supplier.

    '
  anchor_files:
  - erpnext/buying/doctype/purchase_order/purchase_order.py
  - erpnext/selling/doctype/sales_order/sales_order.py
- id: Q29
  group: F
  group_title: Trap / hallucination resistance
  origin_note: v2 trap (cancelling a billed Purchase Receipt blocks — it does NOT cascade-cancel the invoice)
  question: 'In ERPNext, when you cancel a submitted Purchase Receipt that has already been billed by
    a submitted Purchase Invoice, the system automatically cancels the linked Purchase Invoice as well
    so the documents stay consistent. Which method performs this cascade cancellation, and how does it
    locate the linked invoice?

    '
  key_facts:
  - 'The premise is false — there is NO cascade cancellation. A correct answer must state this rather
    than invent a cascading mechanism.

    '
  - 'PurchaseReceipt.on_cancel (erpnext/stock/doctype/purchase_receipt/purchase_receipt.py) queries submitted
    Purchase Invoice Items referencing the receipt and, if any exist, raises frappe.throw — the cancellation
    is hard-blocked, not propagated.

    '
  - 'The user must manually cancel the linked Purchase Invoice first; only then can the Purchase Receipt
    be cancelled.

    '
  - 'A companion guard (check_next_docstatus) performs the same submitted-invoice check, reinforcing that
    the design choice is block-and-abort, not cascade.

    '
  anchor_files:
  - erpnext/stock/doctype/purchase_receipt/purchase_receipt.py
- id: Q30
  group: F
  group_title: Trap / hallucination resistance
  origin_note: v2 trap (selling below cost is NOT blocked by default — gated behind an off-by-default
    setting)
  question: 'When a user submits a Sales Invoice or Delivery Note where an item''s selling rate is below
    its valuation/purchase cost, where does ERPNext block the submission to prevent selling at a loss?

    '
  key_facts:
  - 'By default it does not block anything — selling below cost is fully permitted out of the box, with
    no warning. A correct answer must state this rather than describe an always-on check.

    '
  - 'The check exists as validate_selling_price in erpnext/controllers/selling_controller.py (called from
    the shared validate flow), but it returns immediately unless the Selling Settings flag validate_selling_price
    is enabled.

    '
  - 'That Selling Settings field defaults to 0 (disabled), so the loss-prevention validation is opt-in,
    not default behavior.

    '
  - 'The check is also skipped for return documents (is_return) even when the setting is enabled.

    '
  - 'When enabled and triggered, the thrown message itself tells the user the validation can be bypassed
    by disabling the setting in Selling Settings — underscoring that it is a soft policy control, not
    an invariant.

    '
  anchor_files:
  - erpnext/controllers/selling_controller.py
  - erpnext/selling/doctype/selling_settings/selling_settings.json

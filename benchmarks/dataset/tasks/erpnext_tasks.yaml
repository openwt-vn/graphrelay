- id: Q24
  group: E
  group_title: Concurrency & database semantics
  origin_note: 'v2 concurrency-db / PR-derived (source_pr #56630/#56622/#56683 — savepoints against Postgres
    transaction abort)'
  question: 'Some ERPNext flows perform a best-effort or optional database write inside a larger transaction
    — for example auto-creating a linked document while submitting another. On PostgreSQL, if such a write
    fails, every later statement in the transaction fails too. What mechanism does the codebase use to
    survive these failures, how does it differ from a full rollback, and where is it applied? Name concrete
    functions and files.

    '
  key_facts:
  - 'The mechanism is named savepoints: frappe.db.savepoint("<name>") before the risky write, and on exception
    frappe.db.rollback(save_point="<name>") — rolling back only to the savepoint, never a full transaction
    rollback.

    '
  - 'The rationale: PostgreSQL aborts the entire transaction when any statement fails (subsequent statements
    raise InFailedSqlTransaction until rollback), while MariaDB rolls back only the failed statement and
    continues — so the savepoint recovers the transaction on Postgres and is effectively a no-op on MariaDB.

    '
  - 'make_subcontracting_order in erpnext/buying/doctype/purchase_order/mapper.py wraps the subcontracting-order
    submit in savepoint "submit_subcontracting_order".

    '
  - 'make_reposting_for_accounting_ledgers in erpnext/stock/doctype/repost_item_valuation/repost_item_valuation.py
    wraps per-transaction repost creation in savepoint "repost_accounting_ledger".

    '
  - 'auto_create_fiscal_year in erpnext/accounts/doctype/fiscal_year/fiscal_year.py wraps the duplicate-prone
    Fiscal Year insert in savepoint "auto_create_fiscal_year".

    '
  - 'trigger_invoice_update_for_subscriptions in erpnext/accounts/doctype/payment_entry/payment_entry.py
    wraps per-subscription updates in savepoint "subscription_update".

    '
  - 'Further sites include the subcontracting receipt mapper ("submit_subcontracting_receipt"), CRM customer
    linking ("crm_customer_links" in erpnext/crm/frappe_crm_api.py) and Plaid transaction sync ("plaid_sync_txn").

    '

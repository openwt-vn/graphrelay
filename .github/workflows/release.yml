name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-15
            strip: strip -x

          # macOS Intel (x86_64-apple-darwin) is NOT built: `ort` (ONNX Runtime bindings)
          # ships no prebuilt binary for that target — "ort does not provide prebuilt
          # binaries for the target `x86_64-apple-darwin` with feature set (no features)".
          # Would require building ONNX Runtime from source or switching backends
          # (see https://ort.pyke.io/setup/linking); out of scope for now.

          # Linux x86_64 — gnu (ort has no prebuilt musl binaries)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            strip: strip
            packages: g++
            cxx: g++

          # Linux ARM64 — gnu (not musl) because ort has no prebuilt musl/aarch64 binary
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            strip: aarch64-linux-gnu-strip
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            cxx: aarch64-linux-gnu-g++

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -n "${{ matrix.packages }}" ]; then sudo apt-get install -y ${{ matrix.packages }}; fi

      - name: Install Rust toolchain
        # Pinned for the same reason as ci.yml — see that file's comment.
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CXX: ${{ matrix.cxx }}
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          ${{ matrix.strip }} target/${{ matrix.target }}/release/gr

      - name: Package tarball
        shell: bash
        run: |
          ARCHIVE="graphrelay-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          cp target/${{ matrix.target }}/release/gr gr
          tar czf "$ARCHIVE" gr
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          # sha256sum on Linux, shasum on macOS
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

      # DMG packaging (macOS double-clickable installer, alongside the tarball
      # above) was removed 2026-09-11 — `hdiutil create` failed intermittently
      # on GitHub's macOS runner with "Resource busy" (a known, usually-transient
      # Spotlight/mds lock-contention flake, not a bug in this script), and since
      # this job's DMG step failing blocks the whole `release` job (`needs: build`
      # requires every matrix entry to succeed), one flaky packaging step for an
      # optional convenience format was taking down releases that otherwise built
      # fine on every target. macOS users get the tarball + shell install only.
      # scripts/dmg-install.command and scripts/dmg-readme.txt are unused now but
      # left in place in case DMG packaging is reinstated later (e.g. behind a
      # retry, or moved to a separate, non-blocking job).

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
